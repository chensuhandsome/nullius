[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-contracts"
version = "0.6.0"
description = "Generic scaffold/contracts package for nullius project roots"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "fkg" }]
dependencies = []

[tool.setuptools]
package-dir = { "" = "src", "nullius_windows" = "../shared/python/nullius_windows" }

[tool.setuptools.packages.find]
where = ["src", "../shared/python"]
include = ["project_contracts*", "nullius_windows*"]

[tool.setuptools.package-data]
project_contracts = ["specs/*.json", "scaffold_templates/*"]
